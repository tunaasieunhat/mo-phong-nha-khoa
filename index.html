<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mô Phỏng Nha Khoa: game quản lý phòng khám nha khoa, hỏi bệnh, khám, lập bệnh án và điều trị theo quy trình, kèm thư viện phác đồ để học.">
<meta name="theme-color" content="#a8692f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mô Phỏng NK">
<meta property="og:title" content="Mô Phỏng Nha Khoa">
<meta property="og:description" content="Game mô phỏng phòng khám nha khoa: khám, chẩn đoán, điều trị và quản lý phòng khám.">
<meta property="og:image" content="https://tunaasieunhat.github.io/mo-phong-nha-khoa/og.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>Mô Phỏng Nha Khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-screen isometric clinic + floating HUD; treatment = top bar / canvas + drawer / tool tray. Single bright game look by choice. */
:root{
  --ink:#4b2a10; --ink-soft:#8a5a33; --cream:#fff5da; --paper:#fffaf0; --line:#e2c48d;
  --wood:#a8692f; --wood-dk:#6e4019; --green:#78c443; --green-dk:#4a8d22; --blue:#4fb5e8; --blue-dk:#2b7fb0;
  --red:#ec5b4b; --red-dk:#b5382a; --gold:#ffcb3d; --gold-dk:#d89a12; --mint:#8fe0cf; --mouth:#2a0a10;
  --display:"Baloo 2","Nunito","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#6fb33a;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden}
canvas{display:block}
#world{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#world.dragging{cursor:grabbing}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.hud-left{display:flex;align-items:center;min-width:0}
.lvl{width:58px;height:58px;position:relative;z-index:2;display:grid;place-items:center;font:800 24px/1 var(--display);color:#fff;text-shadow:0 2px 0 #b06d00,0 0 3px #b06d00;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));flex:none}
.lvl svg{position:absolute;inset:0;width:100%;height:100%}.lvl span{position:relative;top:2px}
.lvl.big{width:96px;height:96px;font-size:40px;margin:4px auto}
.xpwrap{margin-left:-14px;background:var(--cream);border:3px solid var(--wood-dk);border-left:0;border-radius:0 14px 14px 0;padding:4px 12px 6px 20px;box-shadow:0 3px 0 rgba(0,0,0,.2);min-width:0}
.clinic-name{font:800 15px/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.xpbar{position:relative;width:150px;height:14px;background:#e9d3a4;border-radius:8px;overflow:hidden;margin-top:3px;box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(#9be15d,#5fb22a);border-radius:8px;transition:width .5s}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font:800 10px/1 var(--body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.daypill{background:rgba(255,250,240,.95);border:3px solid var(--wood-dk);border-radius:14px;padding:3px 12px 4px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.daypill b{display:block;font:800 16px/1.1 var(--display);font-variant-numeric:tabular-nums}.daypill small{font:700 11px/1 var(--body);color:var(--green-dk)}
.hud-right{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--wood-dk);border-radius:999px;padding:3px 12px 3px 4px;font:800 17px/1 var(--display);box-shadow:0 3px 0 rgba(0,0,0,.2);min-width:78px;font-variant-numeric:tabular-nums}
.pill.neg{color:var(--red-dk)}
.money-pill{position:relative}.debt{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);white-space:nowrap;background:var(--red);color:#fff;border:2px solid #fff;border-radius:999px;padding:1px 7px;font:800 10px/1.2 var(--body)}
.ico-coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a6 0 18%,var(--gold) 19% 62%,var(--gold-dk) 63%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);display:inline-grid;place-items:center;font:800 13px/1 var(--display);color:#b27500;flex:none}
.ico-coin.xp{background:radial-gradient(circle at 35% 30%,#d6ffb0 0 18%,#78c443 19% 62%,#4a8d22 63%);color:#fff;font-size:10px}
.round{width:40px;height:40px;border-radius:50%;background:linear-gradient(var(--blue),var(--blue-dk));border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.dock{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5}
.dock-btn{position:relative;width:70px;height:70px;border-radius:20px;background:linear-gradient(#ffe39a,#ffc94a);border:3px solid var(--wood-dk);box-shadow:0 5px 0 var(--wood-dk),0 8px 12px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 12px/1 var(--display);color:var(--ink);transition:transform .1s}
.dock-btn svg{width:36px;height:36px}
.dock-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--wood-dk)}
.dock-btn.ping{animation:ping 1.2s infinite}
@keyframes ping{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;border:2px solid #fff;font:800 12px/18px var(--body);padding:0 5px}
.guide{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;width:min(430px,calc(100% - 520px));min-width:min(300px,calc(100% - 32px));background:var(--paper);border:3px solid var(--wood-dk);border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);font:700 14px/1.4 var(--body);overflow:hidden}
.guide.min,.t-coach.min{width:auto;min-width:0;background:transparent;border:0;box-shadow:none;overflow:visible}
.g-head{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:linear-gradient(#fff1c2,#ffe39a);border-bottom:2px solid var(--line)}
.g-head .doc{flex:none;width:38px;height:38px;border-radius:50%;background:#e6f7ff;border:2px solid var(--wood-dk)}
.g-tt{flex:1;min-width:0}.g-tt small{display:block;font:800 10.5px/1.1 var(--body);color:var(--ink-soft);letter-spacing:.03em;text-transform:uppercase}.g-tt b{display:block;font:800 15px/1.2 var(--display);color:var(--green-dk)}
.g-btn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--paper);border:2px solid var(--wood-dk);font:800 18px/1 var(--display);color:var(--ink)}
.g-body{padding:7px 12px 9px;font:700 13.5px/1.45 var(--body)}.g-body b{color:var(--blue-dk)}.g-body ol{margin:2px 0 0;padding-left:20px}.g-body li{margin:2px 0}
.g-confirm{padding:8px 12px 10px;border-top:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:700 13px/1.35 var(--body)}
.g-open{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px 4px 6px;border-radius:999px;background:var(--paper);border:3px solid var(--wood-dk);box-shadow:0 3px 0 rgba(0,0,0,.2);font:800 14px/1 var(--display);color:var(--ink)}
.g-open b{width:28px;height:28px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:var(--ink);font-size:16px}
.toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(560px,calc(100% - 32px))}
.toast{background:rgba(60,32,10,.92);color:#fff;font:700 14px/1.3 var(--body);padding:8px 14px;border-radius:12px;text-align:center;animation:toastIn .25s ease-out}
.toast.good{background:rgba(54,124,26,.94)}.toast.bad{background:rgba(181,56,42,.94)}
.in-treat .toasts{bottom:auto;top:calc(86px + env(safe-area-inset-top,0px))}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- modal / panels ---------- */
.modal{position:absolute;inset:0;z-index:60;background:rgba(40,22,6,.5);display:grid;place-items:center;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.panel{position:relative;background:var(--cream);border:4px solid var(--wood-dk);border-radius:24px;box-shadow:0 6px 0 var(--wood-dk),0 14px 30px rgba(0,0,0,.35);width:min(640px,100%);max-height:calc(100% - 6px);overflow:auto;padding:0 0 16px;touch-action:pan-y;overscroll-behavior:contain}
.panel.wide{width:min(940px,100%)}
.panel-h{position:sticky;top:0;z-index:3;background:linear-gradient(#c7854a,var(--wood));color:#fff;font:800 22px/1 var(--display);text-align:center;padding:12px 56px 10px;border-bottom:4px solid var(--wood-dk);text-shadow:0 2px 0 var(--wood-dk);border-radius:19px 19px 0 0}
.x{position:absolute;right:10px;top:7px;z-index:4;width:38px;height:38px;border-radius:50%;background:linear-gradient(#ff7a68,var(--red-dk));border:3px solid #fff;color:#fff;font:800 20px/1 var(--display);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.panel-b{padding:12px 16px 0;font:600 14px/1.45 var(--body)}
.panel-b p{margin:6px 0}
.lead{font:700 16px/1.45 var(--body)}
.hero-ic{width:84px;height:84px;margin:6px auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 18px 8px;border-radius:14px;background:linear-gradient(#93d95c,var(--green));border:3px solid var(--green-dk);box-shadow:0 4px 0 var(--green-dk);color:#fff;font:800 16px/1.1 var(--display);text-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dk)}
.btn.small{min-height:36px;padding:4px 12px 6px;font-size:14px;border-radius:12px}
.btn.blue{background:linear-gradient(#7fd0f5,var(--blue));border-color:var(--blue-dk);box-shadow:0 4px 0 var(--blue-dk)}
.btn.red{background:linear-gradient(#ff8a7a,var(--red));border-color:var(--red-dk);box-shadow:0 4px 0 var(--red-dk)}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:var(--ink-soft);box-shadow:0 4px 0 var(--ink-soft);text-shadow:none}
.btn[disabled]{filter:grayscale(1);opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}.row.left{justify-content:flex-start;margin:6px 0 10px}
.muted{color:var(--ink-soft);font:600 13px/1.4 var(--body)}
.center{text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{padding:6px 12px 5px;border-radius:999px;background:#f3e1b8;color:var(--ink);font:800 14px/1.1 var(--display);border:2px solid transparent}
.tab.on{background:var(--gold);border-color:var(--gold-dk)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.card{background:var(--paper);border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.card-ic{height:84px;display:grid;place-items:center}.card-ic svg{width:64px;height:64px}.card-ic img{max-height:84px;width:auto}
.card h4{margin:0;font:800 15px/1.15 var(--display)}
.card p{margin:0;font:600 12px/1.35 var(--body);color:var(--ink-soft);flex:1}
.tag{font:800 12px/1 var(--body);padding:6px 10px;border-radius:999px;background:#eadfca}.tag.ok{background:#dff3cf;color:var(--green-dk)}.tag.lock{color:var(--red-dk)}
.price{display:inline-flex;align-items:center;gap:4px}.price .ico-coin{width:18px;height:18px;font-size:10px}
.note{background:#eef8ff;border:2px solid #9fd2ee;border-radius:12px;padding:9px 12px;font:600 13.5px/1.45 var(--body);margin:8px 0}
.note.left{text-align:left}.note.warnbox,.warnbox{background:#fff1e6;border-color:#f3b58c}
.warn{color:var(--red-dk);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 10px}.stat b{display:block;font:800 21px/1.1 var(--display);font-variant-numeric:tabular-nums}.stat small{font:700 12px/1.2 var(--body);color:var(--ink-soft)}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%}
.review th,.review td,.loglist th,.loglist td,.stock th,.stock td{padding:7px 8px;border-bottom:1px solid #efdcb6;text-align:left;vertical-align:top;font:600 13.5px/1.35 var(--body)}
.review th{font-weight:800;white-space:nowrap}
.review td.ok{color:var(--green-dk);font-weight:800}.review td.no{color:var(--red-dk);font-weight:800}.review td.half{color:var(--gold-dk);font-weight:800}
.review.fin th{white-space:normal}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.neg{color:var(--red-dk)}.pos{color:var(--green-dk)}
tr.tot th,tr.tot td{font-weight:800;border-top:2px solid var(--wood-dk)}
.loglist small,.stock small{display:block;color:var(--ink-soft);font-size:12px}
.loglist .dim{opacity:.25}
.stock .ic svg{width:36px;height:36px}.stock tr.low{background:#fff0e6}
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.quests li{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.quests li div{flex:1;min-width:0}.quests small{display:block;color:var(--ink-soft)}
.qc{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.quests li.done .qc,.quests li.claimed .qc{background:var(--green);border-color:var(--green-dk)}
h4.sec{font:800 16px/1.2 var(--display);margin:14px 0 6px}
.book{margin:0;padding-left:20px}.book li{margin:4px 0}
.book-body details{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin:8px 0}
.book-body summary{cursor:pointer;font:700 14px/1.4 var(--body)}
.tool-chip{display:inline-block;background:#e6f4ff;border-radius:6px;padding:0 6px;font:700 12px/1.6 var(--body);color:var(--blue-dk)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tg{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 8px}
.tg-ic{width:40px;height:40px;flex:none}.tg-ic svg{width:40px;height:40px}.tg small{display:block;color:var(--ink-soft);font:600 12px/1.35 var(--body)}
.mentor{display:flex;gap:12px;align-items:center}.mentor canvas{width:110px;height:110px;flex:none;background:#e6f7ff;border-radius:50%;border:3px solid var(--wood-dk)}
.bubble-txt{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px}.bubble-txt p{margin:4px 0 0;font:700 15px/1.45 var(--body)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:9px;height:9px;border-radius:50%;background:#e2c48d}.dots i.on{background:var(--wood)}
.form label{display:flex;flex-direction:column;gap:4px;font:800 13px/1.2 var(--body);margin:8px 0}
.form input,.form select,.record select,.record textarea{width:100%;box-sizing:border-box;padding:9px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;font:700 15px/1.2 var(--body)}
.radios{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:700 14px/1.3 var(--body)}
.radios label{flex-direction:row!important;align-items:center;gap:6px!important;margin:4px 0!important;font-weight:700!important}
.record fieldset{border:2px solid var(--line);border-radius:12px;margin:8px 0;padding:6px 10px 10px;background:var(--paper)}
.record legend{font:800 13px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);padding:0 6px}
.record label{display:block;font:800 13px/1.3 var(--body);margin:4px 0}
.rec-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font:700 13px/1.3 var(--body)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font:600 13.5px/1.35 var(--body)}.kv span{color:var(--ink-soft)}
.checks{display:flex;flex-direction:column;gap:4px}.checks label{display:flex;gap:8px;align-items:flex-start;font:700 14px/1.35 var(--body);margin:0;padding:5px 6px;border-radius:8px}
.checks label:hover{background:#fff4d6}.checks input{margin-top:3px;flex:none;width:18px;height:18px}
.checks.meds small{display:block;color:var(--ink-soft);font:600 12px/1.3 var(--body)}
.consent{display:flex;gap:8px;align-items:flex-start;font:700 14px/1.4 var(--body);margin-top:10px;background:#f2fbe9;border:2px solid #b9e29a;border-radius:12px;padding:8px 10px}
.dx-list{display:flex;flex-direction:column;gap:8px}
.dx-opt{text-align:left;background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:10px 12px;font:700 15px/1.3 var(--body);color:var(--ink)}
.dx-opt.right{border-color:var(--green-dk);background:#e5f7d4}.dx-opt.wrong{border-color:var(--red-dk);background:#fde1dc}
.stars{display:flex;justify-content:center;gap:6px;margin:4px 0}.stars svg{width:52px;height:52px}.stars svg.off{filter:grayscale(1);opacity:.3}
.reward{display:flex;justify-content:center;gap:12px;font:800 20px/1 var(--display);margin:8px 0}
.reward span{display:flex;gap:6px;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.score th{text-align:left;font:700 13.5px/1.3 var(--body);padding:5px 0;width:44%}
.score td{padding:5px 6px;font:800 13.5px/1 var(--body);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.score td:nth-child(2){width:40%}.score td i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--green))}
.notes{margin:6px 0;padding-left:20px;font:600 13px/1.45 var(--body)}
details summary{font:800 14px/1.4 var(--body)}

/* ---------- treatment ---------- */
.treat{position:absolute;inset:0;z-index:30;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);background:var(--mouth)}
.t-bar{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#c7854a,var(--wood));border-bottom:4px solid var(--wood-dk)}
.t-phases{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px}
.phase{font:800 10.5px/1 var(--display);padding:3px 7px 2px;border-radius:999px;background:#f0e2c4;color:#a08060;white-space:nowrap}
.phase.on{background:var(--gold);color:var(--ink)}.phase.done{background:#cfeab8;color:var(--green-dk)}
.t-step{flex:1;min-width:0;background:var(--paper);border:2px solid var(--wood-dk);border-radius:12px;padding:5px 10px 6px}
.t-step b{font:800 15px/1.2 var(--display);color:var(--blue-dk)}
.t-step #tText{display:block;font:700 13px/1.35 var(--body);color:var(--ink)}

<script>
"use strict";
/* ================== CORE: utils, state, save, audio ================== */
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wpick = (arr) => { const tot = arr.reduce((s, x) => s + x.w, 0); let r = Math.random() * tot; for (const x of arr) { r -= x.w; if (r <= 0) return x; } return arr[0]; };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rr(ctx, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
/* render quality: Q.scale lowers the canvas resolution on slow devices (auto) or by setting */
const Q = { scale: 1, ema: 16.7, evalT: 0, slow: 0, fast: 0 };
const DPR = () => Math.max(0.75, Math.min(window.devicePixelRatio || 1, 2) * Q.scale);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function money(n) { return Math.round(n).toLocaleString('vi-VN') + 'đ'; }
function moneyShort(n) {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e9) return s + (a / 1e9).toFixed(a >= 1e10 ? 0 : 1).replace('.', ',').replace(',0', '') + ' tỷ';
  if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e8 ? 0 : 1).replace('.', ',').replace(',0', '') + 'tr';
  if (a >= 1e3) return s + Math.round(a / 1e3) + 'k';
  return s + Math.round(a) + 'đ';
}
function clock(min) { const h = Math.floor(min / 60), m = Math.floor(min % 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
const setText = (el, s) => { if (el && el.textContent !== s) el.textContent = s; };

/* ---------- game state ---------- */
const SAVE_KEY = 'mpnk_v3';
function freshState() {
  return {
    v: 3, profile: { name: '', clinic: 'Nha Khoa Nụ Cười', g: 'm', school: '', set: false },
    money: START_MONEY, loan: 0, xp: 0, level: 1, rep: 3.0,
    day: 1, time: 8 * 60, dayDone: false,
    today: { patients: 0, revenue: 0, supply: 0, other: 0, angry: 0 },
    chairs: 1, chairLv: [1, 0, 0], assoc: [null, null, null],
    equip: { xray: false, bp: false, endo: false, extract: false, surgery: false, pano: false },
    decor: { plant: 0, tv: 0, tank: 0, sofa: 0, ac: 0 },
    stock: Object.assign({}, START_STOCK),
    quests: {}, tut: 0, newbie: 0, guideMin: false, quiz: {},
    log: [], fin: [],
    stats: { treated: 0, byType: {}, dxRight: 0, perfect: 0, orders: 0, fullHx: 0, referred: 0, chartRight: 0, wasteQ: 0, compl: 0 },
    settings: { sound: true, hints: true, guide: true, gfx: 'auto' },
  };
}
let G = { settings: { sound: true, hints: true, guide: true, gfx: 'auto' }, stats: {} };
function loadGame() {
  G = freshState();
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && s.v === 3) { const f = freshState(); G = Object.assign(f, s); for (const k of ['profile', 'equip', 'decor', 'stock', 'stats', 'settings', 'today', 'quiz']) G[k] = Object.assign(f[k], s[k] || {}); }
  } catch (e) { }
}
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) { } }
const xpNeed = (lv) => 200 + (lv - 1) * 180;
/* kind: supply | film | equip | staff | decor | fixed | interest | loan (loan = borrowing/repaying, not income or expense) */
function addMoney(amount, label, kind) {
  G.money += amount; G.fin.unshift({ d: G.day, t: clock(G.time), label, amount, kind: kind || '' }); if (G.fin.length > 120) G.fin.pop();
  if (kind === 'loan') return;
  if (amount > 0) G.today.revenue += amount; else if (kind === 'supply' || kind === 'film') G.today.supply -= amount; else if (kind !== 'fixed' && kind !== 'interest') G.today.other -= amount;
}

/* ---------- toasts ---------- */
function toast(msg, kind) {
  const el = document.createElement('div'); el.className = 'toast' + (kind ? ' ' + kind : ''); el.textContent = msg;
  const box = $('toasts'); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 2800);
}

/* ---------- audio (WebAudio, starts after first tap) ---------- */
const Sound = {
  ctx: null, motor: null,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } },
  tone(freq, dur, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    if (!G.settings.sound || !this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  tap() { this.tone(660, 0.08, 'triangle', 0.08); },
  tick() { this.tone(2600, 0.03, 'square', 0.045); },
  rough() { this.tone(900, 0.04, 'sawtooth', 0.035); },
  pop() { this.tone(420, 0.12, 'sine', 0.12, 380); },
  coin() { this.tone(988, 0.1, 'square', 0.05); this.tone(1319, 0.25, 'square', 0.05, 0, 0.08); },
  good() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.09, 0, i * 0.08)); },
  bad() { this.tone(220, 0.22, 'sawtooth', 0.05, -80); },
  step() { this.tone(784, 0.1, 'triangle', 0.08); this.tone(1175, 0.16, 'triangle', 0.07, 0, 0.07); },
  beep(f = 1500) { this.tone(f, 0.06, 'square', 0.04); },
  horn() { this.tone(330, 0.18, 'square', 0.04); this.tone(392, 0.25, 'square', 0.04, 0, 0.2); },
  motorOn(kind) {
    if (!G.settings.sound || !this.ctx || this.motor) return; const c = this.ctx;
    const base = { scaler: 2600, air: 900, hs: 2100, ls: 700, surgdrill: 1200, finish: 1900, polish: 500, polishbrush: 500, niti: 400, suction: 300 }[kind]; if (!base) return;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
    o.type = kind === 'air' ? 'triangle' : 'sawtooth'; o.frequency.value = base; f.type = 'bandpass'; f.frequency.value = base * 1.3; f.Q.value = 2;
    l.frequency.value = 23; lg.gain.value = base * 0.02; l.connect(lg).connect(o.frequency);
    g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(kind === 'air' ? 0.02 : 0.032, c.currentTime + 0.08);
    o.connect(f).connect(g).connect(c.destination); o.start(); l.start(); this.motor = { o, l, g };
  },
  motorOff() { if (!this.motor || !this.ctx) return; const m = this.motor; this.motor = null; const t = this.ctx.currentTime; m.g.gain.cancelScheduledValues(t); m.g.gain.setValueAtTime(Math.max(0.0001, m.g.gain.value), t); m.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); m.o.stop(t + 0.1); m.l.stop(t + 0.1); },
};
const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } };

/* ---------- layer cache: renders a world-space layer once, re-uses it while the camera pans inside it ----------
   view = { tx, ty: integer device-px translation of world origin, s: device px per world unit, wpx, hpx: screen size in device px } */
class LayerCache {
  constructor(n = 1, maxPx = 9e6) { this.cvs = []; for (let k = 0; k < n; k++) this.cvs.push(document.createElement('canvas')); this.maxPx = maxPx; this.key = null; this.s = 0; this.ox = 0; this.oy = 0; this.cw = 0; this.ch = 0; }
  covers(v) { if (this.key === null) return false; const r = v.s / this.s, x0 = this.ox * r + v.tx, y0 = this.oy * r + v.ty; return x0 <= 0.5 && y0 <= 0.5 && x0 + this.cw * r >= v.wpx - 0.5 && y0 + this.ch * r >= v.hpx - 0.5; }
  invalidate() { this.key = null; }
  /* returns true when it rebuilt */
  ensure(v, key, render, allowScaled) {
    const same = Math.abs(v.s - this.s) < 1e-6 * v.s;
    if (this.key === key && (same || allowScaled) && this.covers(v)) return false;
    const area = v.wpx * v.hpx, m = clamp((Math.sqrt(this.maxPx / Math.max(1, area)) - 1) / 2, 0.02, 0.22);
    this.s = v.s; this.ox = Math.floor(-v.tx - v.wpx * m); this.oy = Math.floor(-v.ty - v.hpx * m);
    this.cw = Math.min(8192, Math.ceil(v.wpx * (1 + 2 * m)) + 2); this.ch = Math.min(8192, Math.ceil(v.hpx * (1 + 2 * m)) + 2);
    for (const c of this.cvs) { if (c.width !== this.cw || c.height !== this.ch) { c.width = this.cw; c.height = this.ch; } }
    render(this.cvs.map((c) => { const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.cw, this.ch); x.setTransform(this.s, 0, 0, this.s, -this.ox, -this.oy); return x; }), this);
    this.key = key; return true;
  }
  /* draw canvas k onto ctx (identity transform expected) */
  blit(ctx, v, k = 0) { const r = v.s / this.s; if (Math.abs(r - 1) < 1e-6) ctx.drawImage(this.cvs[k], this.ox + v.tx, this.oy + v.ty); else ctx.drawImage(this.cvs[k], this.ox * r + v.tx, this.oy * r + v.ty, this.cw * r, this.ch * r); }
  /* draw canvas k in world coordinates (ctx carries the world transform) */
  blitWorld(ctx, k = 0) { ctx.drawImage(this.cvs[k], this.ox / this.s, this.oy / this.s, this.cw / this.s, this.ch / this.s); }
}

/* ---------- tiled layer cache for the big scrolling world: tiles are rendered once per zoom level and re-used while
   panning; new tiles are rendered a few per frame; after a zoom the old tiles are shown scaled until new ones are ready */
class TileLayer {
  constructor(size = 512, n = 2, perFrame = 5) { this.size = size; this.n = n; this.perFrame = perFrame; this.sets = []; this.pool = []; this.frame = 0; this.key = null; }
  newSet(s) { const S = { s, tiles: new Map() }; this.sets.push(S); while (this.sets.length > 2) this.drop(this.sets.shift()); return S; }
  drop(S) { for (const t of S.tiles.values()) this.pool.push(t); S.tiles.clear(); }
  invalidate() { this.sets.forEach((S) => this.drop(S)); this.sets = []; }
  range(S, v, ring = 0) { const r = S.s / v.s, z = this.size; return [Math.floor((-v.tx) * r / z) - ring, Math.floor((-v.ty) * r / z) - ring, Math.floor((v.wpx - 1 - v.tx) * r / z) + ring, Math.floor((v.hpx - 1 - v.ty) * r / z) + ring]; }
  render(S, ix, iy, renderFn) {
    let t = this.pool.pop(); if (!t) { t = { cv: [] }; for (let k = 0; k < this.n; k++) { const c = document.createElement('canvas'); c.width = c.height = this.size; t.cv.push(c); } }
    t.ix = ix; t.iy = iy; t.used = this.frame;
    renderFn(t.cv.map((c) => { const x = c.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.size, this.size); x.setTransform(S.s, 0, 0, S.s, -ix * this.size, -iy * this.size); return x; }), t, [ix * this.size / S.s, iy * this.size / S.s, (ix + 1) * this.size / S.s, (iy + 1) * this.size / S.s]);
    S.tiles.set(ix + ',' + iy, t); return t;
  }
  /* settled = camera zoom not changing; renderFn(ctxs, tile, worldRect) */
  missingIn(S, v) { const R = this.range(S, v); for (let iy = R[1]; iy <= R[3]; iy++) for (let ix = R[0]; ix <= R[2]; ix++) if (!S.tiles.has(ix + ',' + iy)) return true; return false; }
  prepare(v, key, renderFn, settled) {
    this.frame++; this.holes = false; if (key !== this.key) { this.invalidate(); this.key = key; }
    let A = this.sets[this.sets.length - 1];
    if (!A) A = this.newSet(v.s); else if (Math.abs(A.s - v.s) > 1e-6 * v.s && (settled || A.s / v.s > 1.35 || A.s / v.s < 0.62)) A = this.newSet(v.s);
    const R = this.range(A, v), need = [];
    for (let iy = R[1]; iy <= R[3]; iy++) for (let ix = R[0]; ix <= R[2]; ix++) { const t = A.tiles.get(ix + ',' + iy); if (t) t.used = this.frame; else need.push([ix, iy]); }
    const hasFallback = this.sets.length > 1 && !this.missingIn(this.sets[0], v), fresh = this.sets.length === 1 && A.tiles.size === 0;
    let budget = fresh ? need.length : hasFallback ? this.perFrame : this.perFrame + 2;
    for (const [ix, iy] of need) { if (budget <= 0) break; this.render(A, ix, iy, renderFn); budget--; }
    const aMissing = need.some(([ix, iy]) => !A.tiles.has(ix + ',' + iy));
    if (aMissing && !hasFallback) this.holes = true;
    if (!aMissing && this.sets.length > 1) this.drop(this.sets.shift());
    if (!aMissing && this.sets.length === 1) { let pre = 1; const P = this.range(A, v, 1); outer: for (let iy = P[1]; iy <= P[3]; iy++) for (let ix = P[0]; ix <= P[2]; ix++) if (!A.tiles.has(ix + ',' + iy)) { this.render(A, ix, iy, renderFn); if (--pre <= 0) break outer; } }
    for (const S of this.sets) if (S.tiles.size > 60) { const P = this.range(S, v, 2); for (const [id, t] of S.tiles) if (t.ix < P[0] || t.ix > P[2] || t.iy < P[1] || t.iy > P[3]) { S.tiles.delete(id); this.pool.push(t); } }
    if (this.pool.length > 16) this.pool.length = 16;
  }
  /* composite layer k onto ctx (identity transform) */
  blit(ctx, v, k, fill) {
    let missing = false;
    for (const S of this.sets) {
      const r = v.s / S.s, z = this.size, R = this.range(S, v), same = Math.abs(r - 1) < 1e-6;
      for (let iy = R[1]; iy <= R[3]; iy++) for (let ix = R[0]; ix <= R[2]; ix++) {
        const t = S.tiles.get(ix + ',' + iy);
        if (!t) { if (S === this.sets[0]) missing = true; continue; }
        if (same) ctx.drawImage(t.cv[k], ix * z + v.tx, iy * z + v.ty); else ctx.drawImage(t.cv[k], ix * z * r + v.tx, iy * z * r + v.ty, z * r, z * r);
      }
    }
    return missing;
  }
  /* draw layer k inside world rect W (ctx carries the world transform) */
  blitWorld(ctx, k, W) {
    for (const S of this.sets) {
      const z = this.size / S.s, x0 = Math.floor(W[0] / z), y0 = Math.floor(W[1] / z), x1 = Math.floor(W[2] / z), y1 = Math.floor(W[3] / z);
      for (let iy = y0; iy <= y1; iy++) for (let ix = x0; ix <= x1; ix++) { const t = S.tiles.get(ix + ',' + iy); if (t) ctx.drawImage(t.cv[k], ix * z, iy * z, z, z); }
    }
  }
}

/* ================== DATA: clinical content + economy ==================

/* ---------- viewer (own overlay above dialogs, so it can be opened from anywhere) ---------- */
let protoCur = 'caries';
function initProtocols() { $('protoClose').onclick = () => { Sound.tap(); closeProtocols(); }; $('proto').addEventListener('pointerdown', (e) => { if (e.target === $('proto')) closeProtocols(); }); }
function closeProtocols() { $('proto').hidden = true; if ($('modal').hidden && $('treat').hidden) W.paused = false; }
function openProtocols(id) {
  Sound.tap(); if (id && PROTOCOLS.some((p) => p.id === id)) protoCur = id;
  $('proto').hidden = false; W.paused = true; renderProtocol();
}
function renderProtocol() {
  const P = PROTOCOLS.find((p) => p.id === protoCur) || PROTOCOLS[0];
  $('protoNav').innerHTML = PROTOCOLS.map((p) => { const best = G.quiz[p.id]; return `<button class="pn ${p.id === P.id ? 'on' : ''}" data-p="${p.id}"><span class="pn-ic">${icon(p.icon)}</span><span><b>${esc(p.title)}</b><small>${esc(p.sub)}</small></span>${best != null ? `<em class="${best >= 1 ? 'ok' : ''}">${Math.round(best * 100)}%</em>` : ''}</button>`; }).join('');
  const steps = P.game ? STEPS[CASES[P.game].treat] : null;
  $('protoMain').innerHTML = `<header class="ph"><h3>${esc(P.title)}</h3><p>${esc(P.sub)}</p></header>
    ${PFIG[P.id] ? `<figure>${PFIG[P.id]}</figure>` : ''}
    ${P.sections.map(([h, body], k) => `<details class="psec" ${k < 3 ? 'open' : ''}><summary>${esc(h)}</summary><div class="psec-b">${body}</div></details>`).join('')}
    ${steps ? `<details class="psec"><summary>Thực hành trong game: ${steps.length} bước</summary><div class="psec-b"><ol>${steps.map((s) => `<li><b>${esc(s.title)}</b> <span class="tool-chip">${esc(TOOLS[s.tool][0])}</span><br><small>${esc(s.text)}</small></li>`).join('')}</ol><button class="btn small blue" data-prac="${P.game}">Luyện tập ca này</button></div></details>` : ''}
    <section class="pquiz"><h4 class="sec">Tự kiểm tra</h4>${P.quiz.map((q, i) => `<div class="pq" data-i="${i}"><p><b>${i + 1}. ${esc(q.q)}</b></p>${shuffleSeed(q.o, P.id + i).map((o) => `<label><input type="radio" name="pq${i}" value="${o[1]}"> ${esc(o[0])}</label>`).join('')}<div class="pq-why" hidden></div></div>`).join('')}<div class="row left"><button class="btn small" id="pqSubmit">Nộp bài</button><span class="pq-res" id="pqRes"></span></div></section>
    <section class="prefs"><h4 class="sec">Tài liệu tham khảo</h4><ol>${PROTO_REFS.map(([t, u]) => `<li>${esc(t)} <a href="${u}" target="_blank" rel="noopener">Xem nguồn</a></li>`).join('')}</ol><p class="muted">Nội dung tóm tắt để học trong game, không thay thế tài liệu chuyên môn và chỉ định của bác sĩ.</p></section>`;
  $('protoMain').scrollTop = 0;
  document.querySelectorAll('#protoNav .pn').forEach((b) => b.onclick = () => { protoCur = b.dataset.p; Sound.tap(); renderProtocol(); });
  const pr = document.querySelector('#protoMain [data-prac]'); if (pr) pr.onclick = () => { if (T.p) { toast('Hãy hoàn thành ca đang khám trước.'); return; } closeProtocols(); hideModal(); const p = makePatient(pr.dataset.prac); p.teeth = makeMouth(p.type, p.target); openTreatment(p, true); };
  $('pqSubmit').onclick = () => {
    let right = 0; const n = P.quiz.length, blank = P.quiz.some((q, i) => !document.querySelector(`input[name="pq${i}"]:checked`));

/* ================== PRESCRIPTION, POST-OP INSTRUCTIONS, SCORING, PAYMENT ================== */
function openRx() {

  const hxNote = T.asked.has('allergy') || T.asked.has('sys') ? `<div class="note"><b>Tiền sử:</b> ${esc(p.hx.sys)} ${esc(p.hx.allergy)} ${esc(p.hx.meds)}</div>` : '<div class="note warnbox">Bạn chưa hỏi tiền sử bệnh và dị ứng thuốc của bệnh nhân.</div>';
  showModal(`<div class="panel-h">Kê đơn & dặn dò</div><div class="panel-b">${tutNote(10)}${hxNote}
    <h4 class="sec">Đơn thuốc</h4><div class="checks meds">${MEDS.map((m) => `<label><input type="checkbox" value="${m.id}"> <b>${esc(m.name)}</b><small>${esc(m.desc)}</small></label>`).join('')}</div>
    <h4 class="sec">Dặn dò bệnh nhân <small class="muted">(chọn tất cả ý đúng)</small></h4><div class="checks instr">${T.instrOrder.map((i) => `<label><input type="checkbox" value="${i}"> ${esc(c.instr[i][0])}</label>`).join('')}</div>
    <div class="row"><button class="btn" id="rxDone">Hoàn tất ca điều trị</button></div></div>`, false);
  $('rxDone').onclick = () => {
    const meds = new Set([...document.querySelectorAll('.meds input:checked')].map((i) => i.value)), ins = new Set([...document.querySelectorAll('.instr input:checked')].map((i) => +i.value));
    if (!meds.size) { toast('Hãy chọn thuốc, hoặc chọn “Không cần thuốc”.', 'bad'); return; }
    finishCase(evalRx(meds, ins));
  };
}
function evalRx(meds, ins) {
  const c = caseOf(), f = T.p.hx.f, notes = []; let rx = 5;
  const chosen = [...meds].filter((x) => x !== 'none'), cls = (id) => (MEDS.find((m) => m.id === id) || {}).cls;
  if (c.meds.need.includes('analgesic') && !chosen.some((id) => cls(id) === 'analgesic')) { rx -= 2; notes.push('Thiếu thuốc giảm đau.'); }
  chosen.forEach((id) => { if (c.meds.no.includes(id)) { rx -= 2; notes.push(`${MEDS.find((m) => m.id === id).name}: không có chỉ định trong ca này.`); } });
  if (f.pen && chosen.includes('amox')) { rx -= 4; notes.push('Bệnh nhân dị ứng Penicillin: không được kê Amoxicillin!'); }

/* ================== UI 1: HUD, modals, shop, stock, staff, records, bank, quests, day report ================== */
function updateHUD() {
  setText($('moneyText'), moneyShort(G.money)); $('moneyText').parentElement.classList.toggle('neg', G.money < 0);
  const debt = $('debtText'); if (debt) { debt.hidden = !G.loan; setText(debt, G.loan ? 'nợ ' + moneyShort(G.loan) : ''); }
  setText($('repText'), G.rep.toFixed(1)); setText($('lvNum'), String(G.level)); setText($('clinicName'), G.profile.clinic || 'Nha Khoa');
  const need = xpNeed(G.level); $('xpFill').style.width = clamp(G.xp / need * 100, 0, 100) + '%'; setText($('xpText'), `${G.xp} / ${need} KN`);
  updateDayPill();
  const q = QUESTS.filter((x) => G.quests[x.id] === 'done').length; setText($('questBadge'), String(q)); $('questBadge').hidden = !q;
  const low = ['gloves', 'lido', 'etch', 'bond', 'comp', 'bur', 'paste', 'chx', 'gauze'].filter((k) => (G.stock[k] || 0) <= 2).length; $('stockBadge').hidden = !low;
}
function updateDayPill() { setText($('dayText'), `Ngày ${G.day} · ${clock(G.time)}`); setText($('dayState'), G.time >= 1020 ? 'Hết giờ làm việc' : G.time >= 990 ? 'Sắp đóng cửa' : 'Đang mở cửa'); }
function showModal(html, closable = true, wide) {
  $('modalPanel').innerHTML = html + (closable ? '<button class="x" id="mClose" aria-label="Đóng">✕</button>' : '');
  $('modalPanel').classList.toggle('wide', !!wide); $('modal').hidden = false; W.paused = true;
  if (closable) $('mClose').onclick = () => { Sound.tap(); hideModal(); };
}
function hideModal() { $('modal').hidden = true; $('modalPanel').innerHTML = ''; if ($('treat').hidden && $('proto').hidden) W.paused = false; }
function tabs(id, list, cur) {
  return `<div class="tabs" id="${id}">${list.map(([k, l]) => `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${l}</button>`).join('')}</div>`;
}
function wireTabs(id, fn) { document.querySelectorAll(`#${id} .tab`).forEach((b) => b.onclick = () => { Sound.tap(); fn(b.dataset.k); }); }

/* ---------- level ---------- */
const UNLOCKS = { 2: ['Ca bệnh mới: Viêm tủy → Điều trị tủy (cần Bộ nội nha và máy X-quang)', 'Ca bệnh mới: Răng lung lay do viêm quanh răng → Nhổ răng (cần Bộ kìm & bẩy)', 'Mua ghế thứ 2, thuê bác sĩ cộng sự', 'Hạn mức vay ngân hàng tăng'], 3: ['Ca bệnh mới: Răng khôn mọc lệch → Phẫu thuật (cần Bộ phẫu thuật và X-quang)', 'Máy X-quang Panorama, ghế thứ 3, máy lạnh'], 4: ['Bệnh nhân đến đông hơn khi uy tín cao'] };
let lvQueue = [];
function gainXP(n) {
  G.xp += n; const ups = [];
  while (G.xp >= xpNeed(G.level)) { G.xp -= xpNeed(G.level); G.level++; ups.push(G.level); }
  updateHUD(); saveGame(); if (!ups.length) return;
  const lv = ups[ups.length - 1], bonus = 300000 * (lv - 1); addMoney(bonus, `Thưởng lên cấp ${lv}`); updateHUD(); saveGame(); Sound.good(); questCheck();
  lvQueue.push({ lv, bonus }); setTimeout(showLevelUp, 300);
}
function showLevelUp() {
  if (!lvQueue.length) return;
  if (!$('modal').hidden || !$('treat').hidden) { setTimeout(showLevelUp, 800); return; }
  const { lv, bonus } = lvQueue.shift();
  showModal(`<div class="panel-h">Lên cấp ${lv}!</div><div class="panel-b center"><div class="lvl big"><svg viewBox="0 0 60 60"><path d="M30 3l8 17 18 2-13 13 4 19-17-9-17 9 4-19L4 22l18-2z" fill="#ffcb3d" stroke="#c98500" stroke-width="3" stroke-linejoin="round"/></svg><span>${lv}</span></div>
    <p>Phòng khám ngày càng có tiếng! Thưởng <b>${money(bonus)}</b>.</p>${(UNLOCKS[lv] || ['Tiếp tục nâng cấp phòng khám nhé!']).map((u) => `<div class="note left"><b>Mở khóa:</b> ${esc(u)}</div>`).join('')}<div class="row"><button class="btn" id="lvOk">Tuyệt vời!</button></div></div>`, false);
  $('lvOk').onclick = () => { Sound.tap(); hideModal(); };
}

/* ---------- shop ---------- */
function card(o) { return `<div class="card ${o.cls || ''}"><div class="card-ic">${o.icon}</div><h4>${esc(o.name)}</h4><p>${esc(o.desc)}</p>${o.foot}</div>`; }
function priceBtn(attr, price, label) { return `<button class="btn small" ${attr}><span class="price"><b class="ico-coin">đ</b>${moneyShort(price)}</span>${label ? ' ' + label : ''}</button>`; }
function spriteIcon(key, scale = 0.55) { const a = ASSETS[key]; return a ? `<img alt="" src="${a.url || ''}" style="width:${Math.round(a.w * scale)}px;max-width:100%">` : ''; }
function pay(price, label, kind) { if (G.money < price) { Sound.bad(); toast(`Không đủ tiền: cần ${money(price)}. Có thể vay vốn ở Hồ sơ → Ngân hàng.`, 'bad'); return false; } addMoney(-price, label, kind); Sound.coin(); return true; }
function openShop(tab = 'equip') {
  Sound.tap(); let body = '';
  if (tab === 'equip') body = Object.entries(EQUIP).map(([k, e]) => card({ icon: icon(EQUIP_ICON[k]), name: e.name, desc: e.desc + ` Bảo trì khoảng ${moneyShort(e.price * DAILY.upkeep)}/ngày.`, foot: G.equip[k] ? '<span class="tag ok">Đã có</span>' : G.level < e.lv ? `<span class="tag lock">Cần cấp ${e.lv}</span>` : priceBtn(`data-eq="${k}"`, e.price) })).join('');
  if (tab === 'chairs') {
    body = CHAIR_SLOTS.map((s, k) => { const owned = k < G.chairs; return card({ icon: spriteIcon(G.chairLv[k] >= 2 ? 'chair_premium' : 'chair_basic', 0.45), name: `Ghế nha khoa #${k + 1}`, desc: owned ? (G.chairLv[k] >= 2 ? 'Ghế cao cấp: bệnh nhân thoải mái hơn, cộng sự làm nhanh hơn 22%.' : 'Ghế cơ bản. Nâng cấp lên ghế cao cấp để tăng tốc độ và sự thoải mái.') : 'Khám nhiều bệnh nhân cùng lúc. Cần thuê bác sĩ cộng sự để dùng ghế này hiệu quả.', foot: owned ? (G.chairLv[k] >= 2 ? '<span class="tag ok">Ghế cao cấp</span>' : priceBtn(`data-up="${k}"`, CHAIR_UP_PRICE, 'Nâng cấp')) : (k !== G.chairs ? '<span class="tag lock">Mua ghế trước đó</span>' : G.level < s.lv ? `<span class="tag lock">Cần cấp ${s.lv}</span>` : priceBtn(`data-ch="${k}"`, s.price)) }); }).join('');
  }
  if (tab === 'staff') {
    body = [1, 2].map((k) => { const a = G.assoc[k], has = k < G.chairs; return card({ icon: icon('mirror'), name: a ? `${a.name} · ghế #${k + 1}` : `Bác sĩ cộng sự · ghế #${k + 1}`, desc: a ? (a.skill >= 2 ? 'Làm được: lấy cao răng, trám, điều trị tủy, nhổ răng.' : 'Làm được: lấy cao răng, trám răng. Đào tạo thêm để làm nội nha, nhổ răng.') + ` Lương ${moneyShort(ASSOC.wage)}/ngày.` : `Tự điều trị các ca đơn giản ở ghế #${k + 1}. Phí tuyển ${moneyShort(ASSOC.hire)}, lương ${moneyShort(ASSOC.wage)}/ngày.`, foot: !has ? '<span class="tag lock">Cần mua ghế này</span>' : a ? (a.skill < 2 ? priceBtn(`data-train="${k}"`, ASSOC.train, 'Đào tạo') : '<span class="tag ok">Đã đào tạo</span>') + ` <button class="btn small ghost" data-fire="${k}">Cho nghỉ</button>` : priceBtn(`data-hire="${k}"`, ASSOC.hire, 'Thuê') }); }).join('');
  }
  if (tab === 'decor') body = Object.entries(DECOR).map(([k, d]) => card({ icon: k === 'plant' ? spriteIcon('plant_a', 0.7) : k === 'tv' ? icon('tv') : k === 'tank' ? spriteIcon('tank', 0.6) : k === 'sofa' ? spriteIcon('sofa', 0.6) : spriteIcon('ac', 0.6), name: d.name + (d.max > 1 ? ` (${G.decor[k]}/${d.max})` : ''), desc: d.desc, foot: G.decor[k] >= d.max ? '<span class="tag ok">Đã có</span>' : G.level < d.lv ? `<span class="tag lock">Cần cấp ${d.lv}</span>` : priceBtn(`data-dec="${k}"`, d.price) })).join('');
  showModal(`<div class="panel-h">Cửa hàng</div><div class="panel-b">${tabs('shopTabs', [['equip', 'Thiết bị'], ['chairs', 'Ghế & nâng cấp'], ['staff', 'Nhân sự'], ['decor', 'Trang trí']], tab)}<p class="muted">Số dư: <b>${money(G.money)}</b>${G.loan ? ` · Đang nợ: <b class="neg">${money(G.loan)}</b>` : ''}</p><div class="grid-cards">${body}</div></div>`, true, true);
  wireTabs('shopTabs', (k) => openShop(k));
  document.querySelectorAll('[data-eq]').forEach((b) => b.onclick = () => { const k = b.dataset.eq; if (pay(EQUIP[k].price, 'Mua ' + EQUIP[k].name, 'equip')) { G.equip[k] = true; spawnTruck(); after(`Đã mua ${EQUIP[k].name}!`, tab); } });
  document.querySelectorAll('[data-ch]').forEach((b) => b.onclick = () => { const k = +b.dataset.ch; if (pay(CHAIR_SLOTS[k].price, `Mua ghế #${k + 1}`, 'equip')) { G.chairs = k + 1; G.chairLv[k] = 1; spawnTruck(); after(`Đã mua ghế #${k + 1}!`, tab); } });
  document.querySelectorAll('[data-up]').forEach((b) => b.onclick = () => { const k = +b.dataset.up; if (pay(CHAIR_UP_PRICE, `Nâng cấp ghế #${k + 1}`, 'equip')) { G.chairLv[k] = 2; after('Đã nâng cấp ghế!', tab); } });
  document.querySelectorAll('[data-hire]').forEach((b) => b.onclick = () => { const k = +b.dataset.hire; if (pay(ASSOC.hire, 'Tuyển bác sĩ cộng sự', 'staff')) { G.assoc[k] = { name: ASSOC.names[k], skill: 1 }; after(`${ASSOC.names[k]} đã nhận việc ở ghế #${k + 1}.`, tab); } });
  document.querySelectorAll('[data-train]').forEach((b) => b.onclick = () => { const k = +b.dataset.train; if (pay(ASSOC.train, 'Đào tạo bác sĩ cộng sự', 'staff')) { G.assoc[k].skill = 2; after('Đào tạo xong: làm được nội nha và nhổ răng.', tab); } });
  document.querySelectorAll('[data-fire]').forEach((b) => b.onclick = () => { const k = +b.dataset.fire; if (b.dataset.sure) { G.assoc[k] = null; after('Đã cho nghỉ việc.', tab); } else { b.dataset.sure = 1; b.textContent = 'Bấm lần nữa'; } });
  document.querySelectorAll('[data-dec]').forEach((b) => b.onclick = () => { const k = b.dataset.dec; if (pay(DECOR[k].price, 'Mua ' + DECOR[k].name, 'decor')) { G.decor[k]++; W.patients.forEach((p) => { const m = maxPatience(); p.patience += m - p.maxPat; p.maxPat = m; }); after(`Đã mua ${DECOR[k].name}!`, tab); } });
  function after(msg, t) { toast(msg, 'good'); updateHUD(); saveGame(); questCheck(); worldDirty(); openShop(t); }
}

/* ---------- stock ---------- */
function buySupply(k, silent) {
  const s = SUPPLIES[k]; if (G.money < s.price) { Sound.bad(); toast(`Không đủ tiền nhập ${s.name}.`, 'bad'); return false; }
  addMoney(-s.price, `Nhập ${s.name}`, 'supply'); G.stock[k] = (G.stock[k] || 0) + s.pack; G.stats.orders++; Sound.coin();
  if (!W.truck) spawnTruck(); if (!silent) toast(`Đã nhập ${s.pack} ${s.unit} ${s.name}.`, 'good');
  updateHUD(); saveGame(); questCheck(); worldDirty(); if (G.tut === 12) setTut(13); return true;
}
function openStock() {
  Sound.tap(); if (G.tut === 12) setTut(13);
  const rows = Object.entries(SUPPLIES).map(([k, s]) => { const n = G.stock[k] || 0; return `<tr class="${n <= 2 ? 'low' : ''}"><td class="ic">${icon(SUP_ICON[k])}</td><th>${esc(s.name)}<small>Gói ${s.pack} ${s.unit} · ${moneyShort(unitCost(k))}/${s.unit}</small></th><td class="num">${n} ${s.unit}</td><td>${priceBtn(`data-buy="${k}"`, s.price, 'Nhập')}</td></tr>`; }).join('');
  showModal(`<div class="panel-h">Kho vật tư</div><div class="panel-b"><p class="muted">Vật tư được trừ khi bắt đầu điều trị; giá vốn mỗi ca hiện trên bảng kết quả. Số dư: <b>${money(G.money)}</b></p><div class="row left"><button class="btn blue small" id="buyBasic">Nhập đủ vật tư cơ bản</button></div><div class="tbl-wrap"><table class="stock">${rows}</table></div></div>`, true, true);
  document.querySelectorAll('[data-buy]').forEach((b) => b.onclick = () => { if (buySupply(b.dataset.buy)) openStock(); });
  $('buyBasic').onclick = () => { let n = 0; for (const k of ['gloves', 'lido', 'etch', 'bond', 'comp', 'bur', 'paste', 'chx', 'gauze']) if ((G.stock[k] || 0) < 5 && buySupply(k, true)) n++; toast(n ? `Đã nhập ${n} loại vật tư.` : 'Vật tư cơ bản vẫn còn đủ.', n ? 'good' : ''); openStock(); };
}

/* ---------- bank ---------- */
const creditLimit = () => BANK.perLevel * G.level;
function borrow(amount) { const room = creditLimit() - G.loan; amount = Math.min(amount, room); if (amount <= 0) { toast('Đã hết hạn mức vay. Lên cấp để tăng hạn mức.', 'bad'); Sound.bad(); return; } G.loan += amount; addMoney(amount, 'Vay ngân hàng', 'loan'); Sound.coin(); toast(`Đã vay ${money(amount)}. Lãi ${Math.round(BANK.rate * 1000) / 10}%/ngày, tính cuối ngày.`, 'good'); updateHUD(); saveGame(); }
function repay(amount) { amount = Math.min(amount, G.loan, Math.max(0, G.money)); if (amount <= 0) { toast(G.loan ? 'Không đủ tiền để trả nợ.' : 'Bạn không có khoản nợ nào.', 'bad'); return; } G.loan -= amount; addMoney(-amount, 'Trả nợ ngân hàng', 'loan'); Sound.coin(); toast(`Đã trả ${money(amount)}.`, 'good'); updateHUD(); saveGame(); }
function bankBody() {
  const lim = creditLimit(), room = Math.max(0, lim - G.loan), interest = Math.round(G.loan * BANK.rate);
  return `<div class="stats"><div class="stat"><b>${moneyShort(G.money)}</b><small>Số dư</small></div><div class="stat"><b class="${G.loan ? 'neg' : ''}">${moneyShort(G.loan)}</b><small>Dư nợ</small></div><div class="stat"><b>${moneyShort(room)}</b><small>Còn được vay (hạn mức ${moneyShort(lim)})</small></div><div class="stat"><b>${moneyShort(interest)}</b><small>Lãi phải trả mỗi ngày</small></div></div>
    <p class="muted">Lãi vay <b>${Math.round(BANK.rate * 1000) / 10}%/ngày</b> trên dư nợ, trừ vào cuối ngày. Nếu số dư bị âm, ngân hàng tính thêm lãi thấu chi <b>${Math.round(BANK.overdraft * 100)}%/ngày</b>. Hạn mức vay tăng theo cấp phòng khám.</p>
    <div class="row left">${room <= 0 ? '<button class="btn small" disabled>Đã hết hạn mức</button>' : `<button class="btn small" data-borrow="${Math.min(5e6, room)}">Vay ${moneyShort(Math.min(5e6, room))}</button>${room > 5e6 ? `<button class="btn small" data-borrow="${room}">Vay tối đa ${moneyShort(room)}</button>` : ''}`}<button class="btn small blue" data-repay="5000000" ${!G.loan ? 'disabled' : ''}>Trả ${moneyShort(Math.min(5e6, G.loan || 5e6))}</button><button class="btn small blue" data-repay="all" ${!G.loan ? 'disabled' : ''}>Trả hết</button></div>`;
}

/* ---------- records ---------- */
function openRecords(tab = 'log') {
  Sound.tap(); let body = '';
  if (tab === 'log') body = G.log.length ? `<div class="tbl-wrap"><table class="loglist"><tr><th>Ngày</th><th>Bệnh nhân</th><th>Ca</th><th>Điểm</th><th>Lãi</th><th></th></tr>${G.log.map((l) => `<tr><td>${l.d}</td><td>${esc(l.name)}, ${l.age}t</td><td>${esc(CASES[l.type].label)} · ${l.type === 'calculus' ? 'toàn hàm' : 'R' + l.tooth}${l.by ? `<small> (${esc(l.by)})</small>` : ''}${l.practice ? '<small> (luyện tập)</small>' : ''}${l.min ? `<small>${l.min} phút ghế</small>` : ''}${l.note ? `<small>Ghi chú: ${esc(l.note)}</small>` : ''}</td><td>${l.score}</td><td class="num ${l.profit < 0 ? 'neg' : ''}">${l.profit == null ? '—' : moneyShort(l.profit)}</td><td>${'★'.repeat(l.stars)}<span class="dim">${'★'.repeat(3 - l.stars)}</span></td></tr>`).join('')}</table></div>` : '<p class="muted">Chưa có ca nào. Hãy khám bệnh nhân đầu tiên!</p>';
  if (tab === 'fin') { const t = G.today; body = `<div class="stats"><div class="stat"><b>${moneyShort(t.revenue)}</b><small>Thu hôm nay</small></div><div class="stat"><b>${moneyShort(t.supply)}</b><small>Vật tư, phim</small></div><div class="stat"><b>${moneyShort(t.other)}</b><small>Mua sắm, nhân sự</small></div><div class="stat"><b>${moneyShort(dailyFixed().total)}</b><small>Chi phí cố định cuối ngày</small></div></div><div class="tbl-wrap"><table class="loglist">${G.fin.map((f) => `<tr><td>N${f.d} ${f.t}</td><td>${esc(f.label)}</td><td class="num ${f.amount < 0 ? 'neg' : 'pos'}">${f.amount > 0 ? '+' : ''}${money(f.amount)}</td></tr>`).join('') || '<tr><td>Chưa có giao dịch.</td></tr>'}</table></div>`; }
  if (tab === 'bank') body = bankBody();
  if (tab === 'stats') { const s = G.stats, acc = s.treated ? Math.round(s.dxRight / s.treated * 100) : 0; body = `<div class="stats"><div class="stat"><b>${s.treated}</b><small>Ca đã điều trị</small></div><div class="stat"><b>${acc}%</b><small>Chẩn đoán đúng</small></div><div class="stat"><b>${s.perfect}</b><small>Ca 3 sao</small></div><div class="stat"><b>${G.rep.toFixed(1)} ★</b><small>Uy tín</small></div><div class="stat"><b>${s.compl || 0}</b><small>Biến chứng</small></div><div class="stat"><b>${s.referred}</b><small>Chuyển tuyến</small></div><div class="stat"><b>${G.day}</b><small>Ngày làm việc</small></div></div>${Object.entries(CASES).map(([k, c]) => `<div class="kvrow"><span>${esc(c.label)}</span><b>${s.byType[k] || 0} ca</b></div>`).join('')}`; }
  if (tab === 'prac') body = `<p class="muted">Luyện tập từng ca bất kỳ lúc nào: không cần thiết bị, không tốn vật tư và thời gian phòng khám, chỉ nhận một nửa kinh nghiệm.</p><div class="grid-cards">${Object.entries(CASES).map(([k, c]) => card({ icon: icon({ caries: 'hs', calculus: 'scaler', pulpitis: 'niti', perio: 'forceps', wisdom: 'surgdrill' }[k]), name: c.label, desc: c.dx[0] + ' → ' + c.plan[0], foot: `<button class="btn blue small" data-prac="${k}">Luyện tập</button>` })).join('')}</div>`;
  showModal(`<div class="panel-h">Hồ sơ phòng khám</div><div class="panel-b">${tabs('recTabs', [['log', 'Sổ khám bệnh'], ['fin', 'Thu chi'], ['bank', 'Ngân hàng'], ['stats', 'Thống kê'], ['prac', 'Luyện tập']], tab)}${body}</div>`, true, true);
  wireTabs('recTabs', (k) => openRecords(k));
  document.querySelectorAll('[data-prac]').forEach((b) => b.onclick = () => { hideModal(); const p = makePatient(b.dataset.prac); p.teeth = makeMouth(p.type, p.target); openTreatment(p, true); });
  document.querySelectorAll('[data-borrow]').forEach((b) => b.onclick = () => { borrow(+b.dataset.borrow); openRecords('bank'); });
  document.querySelectorAll('[data-repay]').forEach((b) => b.onclick = () => { repay(b.dataset.repay === 'all' ? G.loan : +b.dataset.repay); openRecords('bank'); });
}

/* ---------- quests ---------- */
function questCheck() { let ch = false; for (const q of QUESTS) if (!G.quests[q.id] && q.ok()) { G.quests[q.id] = 'done'; ch = true; toast(`Hoàn thành nhiệm vụ: ${q.t}`, 'good'); } if (ch) { saveGame(); updateHUD(); } }
function openQuests() {
  Sound.tap(); if (G.tut === 13) setTut(14);
  showModal(`<div class="panel-h">Nhiệm vụ tân thủ</div><div class="panel-b"><p class="muted">Hoàn thành để nhận thưởng nhỏ. Nguồn thu chính vẫn là điều trị tốt và quản lý chi phí.</p><ul class="quests">${QUESTS.map((q) => { const s = G.quests[q.id]; return `<li class="${s || ''}"><span class="qc">${s ? '✓' : ''}</span><div><b>${esc(q.t)}</b><small>Thưởng ${moneyShort(q.money)}${q.xp ? ` · ${q.xp} KN` : ''}</small></div>${s === 'done' ? `<button class="btn small" data-claim="${q.id}">Nhận</button>` : s === 'claimed' ? '<span class="tag ok">Đã nhận</span>' : ''}</li>`; }).join('')}</ul></div>`);
  document.querySelectorAll('[data-claim]').forEach((b) => b.onclick = () => { const q = QUESTS.find((x) => x.id === b.dataset.claim); G.quests[q.id] = 'claimed'; addMoney(q.money, 'Thưởng nhiệm vụ: ' + q.t); Sound.coin(); updateHUD(); saveGame(); if (q.xp) gainXP(q.xp); openQuests(); });
}

/* ---------- day report ---------- */
function equipValue() { let v = 0; for (const k in EQUIP) if (G.equip[k]) v += EQUIP[k].price; for (let k = 1; k < G.chairs; k++) v += CHAIR_SLOTS[k].price; G.chairLv.forEach((l) => { if (l >= 2) v += CHAIR_UP_PRICE; }); return v; }
function dailyFixed() {
  const wages = G.assoc.filter(Boolean).length * ASSOC.wage, upkeep = Math.round(equipValue() * DAILY.upkeep / 1000) * 1000, interest = Math.round(G.loan * BANK.rate), od = G.money < 0 ? Math.round(-G.money * BANK.overdraft) : 0;
  return { wages, upkeep, interest, od, total: DAILY.rent + DAILY.power + DAILY.recep + wages + upkeep + interest + od };
}
function showDayReport() {
  if (!$('treat').hidden || !$('modal').hidden || !$('proto').hidden) { setTimeout(showDayReport, 1500); return; }
  const t = G.today, F = dailyFixed(), net = t.revenue - t.supply - t.other - F.total;
  const row = (k, v) => v ? `<tr><th>${k}</th><td class="num neg">−${money(v)}</td></tr>` : '';
  showModal(`<div class="panel-h">Kết thúc ngày ${G.day}</div><div class="panel-b"><div class="stats"><div class="stat"><b>${t.patients}</b><small>Bệnh nhân đã điều trị</small></div><div class="stat"><b>${t.angry}</b><small>Bỏ về vì chờ lâu</small></div><div class="stat"><b>${G.rep.toFixed(1)} ★</b><small>Uy tín</small></div></div>
    <table class="review fin"><tr><th>Doanh thu</th><td class="num pos">+${money(t.revenue)}</td></tr>${row('Vật tư, phim X-quang', t.supply)}${row('Mua sắm, nhân sự', t.other)}${row('Thuê mặt bằng', DAILY.rent)}${row('Điện nước', DAILY.power)}${row('Lương lễ tân', DAILY.recep)}${row('Lương bác sĩ cộng sự', F.wages)}${row('Bảo trì thiết bị', F.upkeep)}${row('Lãi vay ngân hàng', F.interest)}${row('Lãi thấu chi (số dư âm)', F.od)}<tr class="tot"><th>Lãi / lỗ trong ngày</th><td class="num ${net < 0 ? 'neg' : 'pos'}">${net >= 0 ? '+' : ''}${money(net)}</td></tr></table>
    ${G.money - F.total < 0 ? '<div class="note warnbox">Sau khi trừ chi phí, số dư sẽ âm. Hãy nhận thêm bệnh nhân, cắt giảm chi phí hoặc vay vốn có kế hoạch.</div>' : ''}
    <div class="row"><button class="btn" id="newDay">Bắt đầu ngày ${G.day + 1}</button></div></div>`, false);
  $('newDay').onclick = () => {
    addMoney(-(F.total - F.interest - F.od), `Chi phí cố định ngày ${G.day}`, 'fixed'); if (F.interest + F.od) addMoney(-(F.interest + F.od), `Lãi ngân hàng ngày ${G.day}`, 'interest');
    G.day++; G.time = 480; G.dayDone = false; G.today = { patients: 0, revenue: 0, supply: 0, other: 0, angry: 0 }; W.spawnT = 2;
    hideModal(); updateHUD(); saveGame(); questCheck(); toast(`Ngày ${G.day}: phòng khám mở cửa!`, 'good');
  };
}

function setTut(n) { if (n <= G.tut) return; G.tut = n; saveGame(); updateGuide(); }
const guideOn = () => G.settings.guide !== false && G.tut >= 1 && G.tut <= TUT_LAST;
function tutNote(n) { if (!guideOn() || G.tut !== n || !TUT[n]) return ''; const [t, x] = TUT[n](); return `<div class="note tutnote"><b>${t}:</b> ${x}</div>`; }
function updateGuide() {
  const n = G.tut, on = guideOn(), inTx = !!T.p, txStep = TUT_TX.has(n);
  const showW = on && !inTx && !txStep, showT = on && inTx && txStep;
  const gEl = $('guide'), cEl = $('tCoach'); gEl.hidden = !showW; cEl.hidden = !showT;
  const el = showW ? gEl : showT ? cEl : null;
  if (el) {
    const [title, text] = TUT[n]();
    el.classList.toggle('min', !!G.guideMin);
    el.innerHTML = G.guideMin ? `<button class="g-open" data-g="open" aria-label="Mở hướng dẫn"><b>?</b> ${title}</button>`
      : `<div class="g-head">${showW ? '<canvas class="doc" width="84" height="84" id="guideFace"></canvas>' : ''}<div class="g-tt"><small>Hướng dẫn tân thủ · ${n}/${TUT_LAST}</small><b>${title}</b></div><button class="g-btn" data-g="min" aria-label="Thu gọn hướng dẫn" title="Thu gọn">–</button><button class="g-btn" data-g="off" aria-label="Tắt hướng dẫn" title="Tắt hướng dẫn">✕</button></div><div class="g-body">${text}</div><div class="g-confirm" hidden>Tắt hướng dẫn tân thủ? Có thể bật lại trong Cài đặt. <button class="btn small red" data-g="offyes">Tắt</button><button class="btn small ghost" data-g="offno">Không</button></div>`;
    el.querySelectorAll('[data-g]').forEach((b) => b.onclick = (e) => {
      e.stopPropagation(); Sound.tap(); const a = b.dataset.g;
      if (a === 'open') { G.guideMin = false; saveGame(); updateGuide(); }
      if (a === 'min') { G.guideMin = true; saveGame(); updateGuide(); }
      if (a === 'off') { el.querySelector('.g-confirm').hidden = false; }
      if (a === 'offno') { el.querySelector('.g-confirm').hidden = true; }
      if (a === 'offyes') { G.settings.guide = false; saveGame(); updateGuide(); toast('Đã tắt hướng dẫn. Bật lại trong Cài đặt.'); }
    });
    const f = $('guideFace'); if (f) { const c = f.getContext('2d'); c.clearRect(0, 0, 84, 84); drawChar(c, STAFF.doc_f, 42, 118, { scale: 1.15, mood: 'happy', noShadow: true }); }
  }
  $('btnStock').classList.toggle('ping', on && n === 12); $('btnQuests').classList.toggle('ping', on && n === 13); $('btnProto').classList.toggle('ping', on && n === 13);
  if (inTx) {
    document.querySelectorAll('.tool.tut').forEach((b) => b.classList.remove('tut'));
    const hl = on ? { 5: [T.tool === 'explorer' ? null : T.tool === 'mirror' ? 'explorer' : 'mirror'], 6: ['cold'], 7: ['chart'] }[n] : null;
    if (hl && T.phase === 'exam') hl.forEach((id) => { const b = id && document.querySelector(`.tool[data-id="${id}"]`); if (b) b.classList.add('tut'); });
    const q = $('qbox'); if (q) q.classList.toggle('tut', on && n === 4);

  }
}

  if (tab === 'exam') b = `<ol class="book"><li><b>Hỏi bệnh (giới hạn ${Q_BUDGET} lượt, thêm 1 lượt với phụ nữ 18–45 tuổi):</b> luôn hỏi bệnh toàn thân, dị ứng thuốc, thuốc đang dùng (và thai kỳ). Dùng lượt còn lại cho câu hỏi giúp chẩn đoán dựa trên lý do đến khám.</li><li><b>Soi:</b> gương nha khoa phóng to bề mặt răng. Đốm nâu đen ở rãnh có thể là lỗ sâu hoặc chỉ là nhiễm màu.</li><li><b>Dò bằng thám trâm:</b> giữ và rê dọc rãnh. Mắc, đáy mềm: lỗ sâu. Trượt, cứng: nhiễm màu, không cần trám.</li><li><b>Thử lạnh:</b> thử răng lành đối chứng trước. Ê buốt hết ngay khi bỏ lạnh: tủy bình thường hoặc viêm tủy có hồi phục. Đau kéo dài sau khi bỏ lạnh: viêm tủy không hồi phục. Không cảm giác: nghi tủy hoại tử.</li><li><b>Đo túi, gõ, lung lay</b> theo triệu chứng; đo huyết áp với bệnh nhân tim mạch.</li><li><b>Phim:</b> chỉ chụp khi có chỉ định (mỗi phim tốn chi phí, thêm liều tia). Răng khôn nên chụp Panorama. Phụ nữ có thai chỉ chụp khi cần và phải mặc áo chì.</li><li><b>Ghi sơ đồ răng</b> rồi lập bệnh án.</li></ol>
    <div class="row left"><button class="btn small blue" id="bookProto">Mở thư viện phác đồ</button></div>`;
  if (tab === 'tools') b = `<div class="tool-grid">${Object.entries(TOOLS).map(([k, t]) => `<div class="tg"><div class="tg-ic">${icon(k)}</div><div><b>${esc(t[0])}</b><small>${esc(t[1])}</small></div></div>`).join('')}</div>`;
  if (tab === 'meds') b = `<ul class="book"><li><b>Kháng sinh chỉ dùng khi có chỉ định.</b> Sâu ngà, viêm tủy không hồi phục, viêm lợi không cần kháng sinh; điều trị tại chỗ là chính.</li><li>Dị ứng Penicillin: không dùng Amoxicillin; thay bằng Clindamycin khi cần kháng sinh.</li><li>Tránh NSAID (Ibuprofen) khi viêm loét dạ dày, hen phế quản, có thai, đang dùng Aspirin hoặc thuốc chống đông. Paracetamol là lựa chọn an toàn hơn.</li><li>Bệnh nhân tăng huyết áp, tim mạch: đo huyết áp trước, ưu tiên thuốc tê không co mạch (Mepivacaine 3%) hoặc giới hạn liều co mạch.</li><li>Đang dùng Aspirin: không tự ý ngưng thuốc; cầm máu tại chỗ kỹ (gạc, khâu).</li></ul><div class="tbl-wrap"><table class="review">${MEDS.filter((m) => m.id !== 'none').map((m) => `<tr><th>${esc(m.name)}</th><td>${esc(m.desc)}</td></tr>`).join('')}</table></div>`;
  if (tab === 'manage') b = `<ul class="book"><li><b>Doanh thu:</b> phí khám ${moneyShort(EXAM_FEE)} + phí điều trị. Bệnh nhân chưa hài lòng (1 sao) xin giảm 20%; biến chứng (vượt chóp, chạm răng bên cạnh) bị giảm phí và mất uy tín.</li><li><b>Giá vốn:</b> mỗi ca tiêu hao vật tư (găng, thuốc tê, vật liệu…), phim X-quang ${moneyShort(XRAY_COST)}/phim, Panorama ${moneyShort(PANO_COST)}. Bảng kết quả cho biết lãi thật của từng ca.</li><li><b>Chi phí cố định mỗi ngày:</b> mặt bằng ${moneyShort(DAILY.rent)}, điện nước ${moneyShort(DAILY.power)}, lễ tân ${moneyShort(DAILY.recep)}, cộng sự ${moneyShort(ASSOC.wage)}/người, bảo trì ${DAILY.upkeep * 100}% giá trị thiết bị/ngày.</li><li><b>Ngân hàng:</b> vay tối đa ${moneyShort(BANK.perLevel)} × cấp phòng khám, lãi ${BANK.rate * 100}%/ngày; số dư âm bị tính thêm ${BANK.overdraft * 100}%/ngày.</li><li><b>Thiết bị</b> mở khóa ca bệnh: Bộ nội nha + X-quang (điều trị tủy), Bộ kìm & bẩy (nhổ răng), Bộ phẫu thuật + X-quang (răng khôn), Panorama.</li><li><b>Ghế & cộng sự:</b> mua thêm ghế rồi thuê bác sĩ cộng sự; họ tự điều trị ca lấy cao răng, trám răng (sau đào tạo: cả nội nha và nhổ răng).</li><li><b>Trang trí</b> giúp bệnh nhân chờ lâu hơn; uy tín cao thì bệnh nhân đến đông hơn.</li></ul>`;
  showModal(`<div class="panel-h">Sổ tay hướng dẫn</div><div class="panel-b">${tabs('bookTabs', [['play', 'Cách chơi'], ['exam', 'Quy trình khám'], ['tools', 'Dụng cụ'], ['meds', 'Thuốc'], ['manage', 'Quản lý']], tab)}<div class="book-body">${b}</div></div>`, true, true);
  wireTabs('bookTabs', (k) => openBook(k));
  if ($('bookProto')) $('bookProto').onclick = () => openProtocols();
}

/* ---------- settings ---------- */
function openSettings() {
  Sound.tap(); const gf = G.settings.gfx || 'auto';
  showModal(`<div class="panel-h">Cài đặt</div><div class="panel-b"><div class="kvrow"><span>Âm thanh</span><button class="btn small ${G.settings.sound ? '' : 'ghost'}" id="sSound">${G.settings.sound ? 'Đang bật' : 'Đang tắt'}</button></div>
    <div class="kvrow"><span>Hướng dẫn tân thủ</span><button class="btn small ${G.settings.guide !== false ? '' : 'ghost'}" id="sGuide">${G.settings.guide !== false ? 'Đang bật' : 'Đang tắt'}</button></div>
    <div class="kvrow"><span>Học lại hướng dẫn từ đầu</span><button class="btn small blue" id="sTutReset">Bắt đầu lại</button></div>
    <div class="kvrow"><span>Gợi ý dụng cụ ở mọi ca</span><button class="btn small ${G.settings.hints ? '' : 'ghost'}" id="sHint">${G.settings.hints ? 'Đang bật' : 'Chỉ ca tân thủ'}</button></div>
    <div class="kvrow"><span>Chất lượng đồ họa</span><span class="seg">${[['auto', 'Tự động'], ['high', 'Cao'], ['low', 'Tiết kiệm']].map(([k, l]) => `<button class="btn small ${gf === k ? '' : 'ghost'}" data-gfx="${k}">${l}</button>`).join('')}</span></div>
    <div class="kvrow"><span>Hồ sơ bác sĩ</span><button class="btn small blue" id="sProf">Sửa</button></div>
    <div class="kvrow"><span>Chơi lại từ đầu</span><button class="btn small ghost" id="sReset">Xóa tiến trình</button></div></div>`);
  $('sSound').onclick = () => { G.settings.sound = !G.settings.sound; if (!G.settings.sound) Sound.motorOff(); saveGame(); openSettings(); };
  $('sGuide').onclick = () => { G.settings.guide = G.settings.guide === false; if (G.settings.guide) G.guideMin = false; saveGame(); updateGuide(); openSettings(); };
  $('sTutReset').onclick = () => { G.tut = 1; G.settings.guide = true; G.guideMin = false; saveGame(); hideModal(); updateGuide(); toast('Hướng dẫn tân thủ sẽ chạy lại từ đầu.', 'good'); };
  $('sHint').onclick = () => { G.settings.hints = !G.settings.hints; saveGame(); openSettings(); };
  document.querySelectorAll('[data-gfx]').forEach((b) => b.onclick = () => { setGfx(b.dataset.gfx); openSettings(); });
  $('sProf').onclick = () => showProfileForm(false);
  const r = $('sReset'); r.onclick = () => { if (r.dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); } else { r.dataset.sure = 1; r.textContent = 'Bấm lần nữa để xóa'; r.classList.add('red'); } };
}

/* ---------- render quality (adaptive resolution) ---------- */
function applyQuality() { resizeWorld(); resizeTreat(); worldDirty(); }
function setGfx(mode) { G.settings.gfx = mode; Q.scale = mode === 'low' ? 0.6 : 1; Q.slow = Q.fast = 0; applyQuality(); saveGame(); }
function qualityTick(ms) {
  if ((G.settings.gfx || 'auto') !== 'auto' || ms > 250 || document.hidden) return;
  Q.ema = lerp(Q.ema, ms, 0.06); Q.evalT += ms; if (Q.evalT < 1500) return; Q.evalT = 0;
  if (Q.ema > 25 && Q.scale > 0.56) { Q.fast = 0; if (++Q.slow >= 2) { Q.scale = Math.max(0.55, Q.scale - 0.15); Q.slow = 0; applyQuality(); } }
  else if (Q.ema < 14 && Q.scale < 1) { Q.slow = 0; if (++Q.fast >= 5) { Q.scale = Math.min(1, Q.scale + 0.15); Q.fast = 0; applyQuality(); } }
  else { Q.slow = 0; Q.fast = 0; }
}

/* ---------- loop + boot ---------- */
function checkRotate() { const portrait = window.innerHeight > window.innerWidth && window.innerWidth < 760; $('rotate').hidden = !(portrait && !G.portraitOK); }
let lastT = performance.now(), hudT = 0;
function frame(now) {
  const ms = now - lastT, dt = Math.min(0.05, ms / 1000); lastT = now;
  try {
    if (!$('treat').hidden && T.p) { updateTreat(dt); drawTreat(); } else tickWorld(dt);
    hudT -= dt; if (hudT <= 0) { hudT = 0.5; updateDayPill(); }
  } catch (err) { console.error(err); }
  qualityTick(ms);
  requestAnimationFrame(frame);
}
async function boot() {
  loadGame(); if (G.settings.gfx === 'low') Q.scale = 0.6;
  await loadAllAssets((f) => { $('loadBar').style.width = Math.round(f * 100) + '%'; });
  $('loading').hidden = true;
  initWorld(); initTreatInput();
  $('btnShop').onclick = () => openShop(); $('btnRecords').onclick = () => openRecords(); $('btnStock').onclick = openStock; $('btnQuests').onclick = openQuests; $('btnBook').onclick = () => openBook(); $('btnSettings').onclick = openSettings; $('btnProto').onclick = () => openProtocols();
  $('tLater').onclick = () => { Sound.tap(); leaveForLater(); }; $('tBook').onclick = () => openProtocols(T.p ? T.p.type : null); $('tDrawerBtn').onclick = () => { Sound.tap(); openDrawer(!$('tDrawer').classList.contains('open')); };
  $('xrayClose').onclick = () => { Sound.tap(); $('xray').hidden = true; };
  $('tHint').onclick = () => { const st = T.phase === 'tx' ? curStep() : null; if (!st) { toast(T.phase === 'exam' ? 'Gợi ý: soi bằng gương, dò răng nghi ngờ bằng thám trâm, làm các test cần thiết, ghi sơ đồ răng rồi lập bệnh án.' : 'Gợi ý: hỏi đủ câu an toàn (bệnh toàn thân, dị ứng, thuốc) và câu hỏi về tính chất cơn đau.'); return; } const el = document.querySelector(`.tool[data-id="${st.tool}"]`); if (el) { el.classList.add('hint'); el.scrollIntoView({ inline: 'center', block: 'nearest' }); } toast(`Bước này dùng: ${TOOLS[st.tool][0]}`); };
  document.querySelectorAll('.d-tab').forEach((b) => b.onclick = () => { Sound.tap(); openDrawer(true, b.dataset.tab); });
  $('btnPortrait').onclick = () => { G.portraitOK = true; saveGame(); checkRotate(); resizeWorld(); };
  $('modal').addEventListener('pointerdown', (e) => { if (e.target === $('modal') && $('mClose')) hideModal(); });
  window.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!$('proto').hidden) closeProtocols(); else if (!$('modal').hidden && $('mClose')) hideModal(); });
  window.addEventListener('resize', () => { resizeWorld(); resizeTreat(); checkRotate(); });
  initProtocols();
  updateHUD(); checkRotate(); questCheck();
  if (!G.profile.set) showWelcome(); else updateGuide();
  requestAnimationFrame(frame);
}
boot();

</script>
<script>
/* Lưu game để chơi offline (chỉ bản web; app Android đã gói sẵn) */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/appassets\.androidplatform\.net$/.test(location.hostname)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
