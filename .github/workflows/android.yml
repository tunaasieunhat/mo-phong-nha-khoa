# Build app Android "Mô Phỏng Nha Khoa" thành file APK.
# Game lấy từ index.html (bản web), gói vào android/app/src/main/assets/www lúc build.
# Có secret ANDROID_KEYSTORE_B64 thì ký bằng khóa riêng và đăng lên Releases; chưa có thì chỉ build thử (ký tạm).
name: Build APK Android

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Gói game và phông chữ vào app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html
          python3 android/tools/fonts.py android/app/src/main/assets/www
          ls -la android/app/src/main/assets/www

      - name: Khóa ký
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning title=Chưa có khóa ký::Thêm secret ANDROID_KEYSTORE_B64 để phát hành APK. Bản này chỉ ký tạm nên không đăng lên Releases."
            exit 0
          fi
          pass="${PASS:-mophongnhakhoa}"; alias="${ALIAS:-mophong}"
          clean=$(printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=')
          if printf '%s' "$clean" | base64 -d > "$RUNNER_TEMP/release.p12" 2>/dev/null \
             && keytool -list -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass "$pass" > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::notice title=Khóa ký hợp lệ::$(grep -o 'SHA-256): .*' "$RUNNER_TEMP/ks.txt" | head -1)"
            { echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12"; echo "KEYSTORE_PASSWORD=$pass"; echo "KEY_ALIAS=$alias"; echo "SIGNED=1"; } >> "$GITHUB_ENV"
          else
            echo "::error title=Secret ANDROID_KEYSTORE_B64 chưa đúng::Secret dài ${#KS} ký tự, còn ${#clean} ký tự base64 (khóa hiện tại đúng phải là 1416). Hãy sửa secret và dán lại TOÀN BỘ nội dung file ANDROID_KEYSTORE_B64.txt."
            exit 1
          fi

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Báo lỗi build
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -E "^e: |error:|What went wrong|^> |Could not|FAILURE|Exception" build.log | head -60 | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::${msg}"
          fi

      - name: Đặt tên file
        run: |
          . android/version.properties
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk MoPhongNhaKhoa.apk
          echo "::notice title=APK::MoPhongNhaKhoa.apk $(stat -c %s MoPhongNhaKhoa.apk) bytes, version ${VERSION_NAME} (${VERSION_CODE}), signed=${SIGNED:-0}"

      - uses: actions/upload-artifact@v4
        with:
          name: MoPhongNhaKhoa-apk
          path: MoPhongNhaKhoa.apk
          retention-days: 14

      - name: Phát hành lên Releases
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="apk-${VERSION_CODE}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Mô Phỏng Nha Khoa ${VERSION_NAME} (bản ${VERSION_CODE})" --notes-file android/RELEASE_NOTES.md --latest
          fi
          gh release upload "$TAG" MoPhongNhaKhoa.apk --clobber
          echo "::notice title=Đã phát hành::https://github.com/${GH_REPO}/releases/tag/${TAG}"
